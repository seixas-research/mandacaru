# Carcará test suite.
#
# The package is pure Python plus one optional C library (the OpenMP integral
# kernels).  Both paths are exercised: the default job builds the C backend and
# runs against it, and a second job forces the NumPy reference kernels, because
# the two must stay in lockstep (see CLAUDE.md, "The C integral backend").
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # macOS needs Homebrew's libomp for the OpenMP kernels; Linux ships it.
      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build the C integral backend
        run: |
          python -c "
          from carcara.integrals._backend import build_backend, check_backend
          build_backend()
          status = check_backend()
          print(status.message)
          raise SystemExit(0 if status.available else 1)
          "

      - name: Run the test suite
        run: python -m pytest test/ -q -p no:cacheprovider --durations=25

  numpy-kernels:
    name: NumPy reference kernels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      # CARCARA_BACKEND=numpy forces the vectorized fallbacks, which mirror the
      # C kernels exactly; a divergence between them must fail here.
      - env:
          CARCARA_BACKEND: numpy
        run: python -m pytest test/ -q -p no:cacheprovider

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[coverage]"
      - run: |
          python -m pytest test/ -q -p no:cacheprovider \
            --cov=carcara --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
