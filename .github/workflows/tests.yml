# Carcará test suite.
#
# The package is pure Python plus one optional C library (the OpenMP integral
# kernels).  Both paths are exercised: the default job builds the C backend and
# runs against it, and a second job forces the NumPy reference kernels, because
# the two must stay in lockstep (see CLAUDE.md, "The C integral backend").
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # macOS needs Homebrew's libomp for the OpenMP kernels; Linux ships it.
      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # ensure_backend() compiles the library and reloads the module; a bare
      # build_backend() + check_backend() would report the import-time state
      # (no library on a fresh checkout) and fail even after a good build.
      - name: Build the C integral backend
        run: |
          python -c "
          import sys
          from pathlib import Path
          from carcara.integrals import _backend
          status = _backend.ensure_backend(build=True, verbose=True)
          log = Path(_backend._BUILD_DIR) / 'build.log'
          if log.exists():
              print('---- build.log ----'); print(log.read_text())
          print(status.message)
          sys.exit(0 if status.available else 1)
          "

      # The PAW and ONCVPSP libraries are git-ignored links to sibling
      # repositories, so a checkout has none; the six elements the tests use
      # are generated in place (~20 s).  The NCPP library ships in the tree.
      - name: Generate the PAW and ONCVPSP test libraries
        run: |
          python -c "
          from carcara.pseudopotentials.paw import build_paw_library
          from carcara.pseudopotentials.oncv import build_oncv_library
          elements = ('H', 'Li', 'C', 'N', 'O', 'F')
          print(len(build_paw_library(elements, verbose=False)), 'PAW datasets')
          print(len(build_oncv_library(elements, verbose=False)), 'ONCVPSP potentials')
          "

      - name: Run the test suite
        run: python -m pytest test/ -q -p no:cacheprovider --durations=25



  numpy-kernels:
    name: NumPy reference kernels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      # The PAW and ONCVPSP libraries are git-ignored links to sibling
      # repositories, so a checkout has none; the six elements the tests use
      # are generated in place (~20 s).  The NCPP library ships in the tree.
      - name: Generate the PAW and ONCVPSP test libraries
        run: |
          python -c "
          from carcara.pseudopotentials.paw import build_paw_library
          from carcara.pseudopotentials.oncv import build_oncv_library
          elements = ('H', 'Li', 'C', 'N', 'O', 'F')
          print(len(build_paw_library(elements, verbose=False)), 'PAW datasets')
          print(len(build_oncv_library(elements, verbose=False)), 'ONCVPSP potentials')
          "

      # CARCARA_BACKEND=numpy forces the vectorized fallbacks, which mirror the
      # C kernels exactly; a divergence between them must fail here.
      - env:
          CARCARA_BACKEND: numpy
        run: python -m pytest test/ -q -p no:cacheprovider

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[coverage]"
      # The PAW and ONCVPSP libraries are git-ignored links to sibling
      # repositories, so a checkout has none; the six elements the tests use
      # are generated in place (~20 s).  The NCPP library ships in the tree.
      - name: Generate the PAW and ONCVPSP test libraries
        run: |
          python -c "
          from carcara.pseudopotentials.paw import build_paw_library
          from carcara.pseudopotentials.oncv import build_oncv_library
          elements = ('H', 'Li', 'C', 'N', 'O', 'F')
          print(len(build_paw_library(elements, verbose=False)), 'PAW datasets')
          print(len(build_oncv_library(elements, verbose=False)), 'ONCVPSP potentials')
          "

      - run: |
          python -m pytest test/ -q -p no:cacheprovider \
            --cov=carcara --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
