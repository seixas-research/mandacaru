[workspace]
members = ["crates/mandacaru-core", "crates/mandacaru-kernels", "crates/mandacaru-python"]
default-members = ["crates/mandacaru-core", "crates/mandacaru-kernels"]
resolver = "2"

[workspace.package]
version = "26.11.18"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
mandacaru-kernels = { path = "crates/mandacaru-kernels" }
mandacaru-core = { path = "crates/mandacaru-core" }
num-complex = "0.4.6"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
rustfft = "6.4"
libm = "0.2"
# The persistent worker pool of a calculation context (`Context::pool`): the threaded state-vector
# kernels of the variational methods (owner decision 2026-11-10).
rayon = "1.10"
ruzstd = { version = "=0.8.1", default-features = false, features = ["std"] }
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
pyo3-build-config = "0.30"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

# Tests: the release optimizations without whole-program LTO. Each of the ~250 integration-test
# binaries links mandacaru-core, and a fat-LTO link per binary made the test build take 25 minutes.
# LTO and codegen units do not change IEEE results (no FMA contraction by default). The wheel
# keeps `[profile.release]`.
[profile.release-test]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
