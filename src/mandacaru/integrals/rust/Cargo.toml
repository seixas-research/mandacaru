[package]
name = "mandacaru_integrals"
version = "26.10.30"
edition = "2021"
rust-version = "1.85"

[workspace]
members = [".", "crates/core", "crates/python"]
default-members = [".", "crates/core"]
resolver = "2"

[lib]
name = "mandacaru_integrals"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
