[package]
name = "mandacaru-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
mandacaru-core = { path = "../core" }
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"

[build-dependencies]
pyo3-build-config = "0.30"
