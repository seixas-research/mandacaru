[package]
name = "mandacaru-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Python-independent scientific types and checked kernel interfaces for Mandacaru"

[dependencies]
mandacaru_integrals = { path = "../.." }
num-complex = "0.4.6"
serde_json = "1.0"
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
rustfft = "6.4"
libm = "0.2"
