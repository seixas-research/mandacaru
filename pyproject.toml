[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carcara"
dynamic = ["version"]
authors = [
  { name="Leandro Seixas Rocha", email="leandro.rocha@ilum.cnpem.br" },
]
description = "A framework for fermionic quantum simulation based on variational quantum algorithms."
readme = "README.md"
license = {file = "LICENSE"} 
requires-python = ">=3.11"
dependencies = [
    # -- numerical core -------------------------------------------------- #
    'numpy>=2.0.0',
    'scipy',
    'ase',                # geometries + the Calculator interface the drivers use
    'matplotlib',         # expressivity / band-structure plotting helpers
    # -- Hamiltonian cache (Apache Parquet) ------------------------------ #
    # fastparquet is the default engine and pandas is its table interface; see
    # carcara.core.serialization for why pyarrow is only an optional engine.
    'fastparquet',
    'pandas',
    # -- quantum SDKs (backend_provider / device registry) ---------------- #
    'qiskit',             # IBM Qiskit -- default circuit provider + profiling
    'qiskit-nature',      # IBM Qiskit Nature
    'qiskit-ibm-runtime', # IBM Qiskit Runtime -- the reserved 'ibm-quantum' device
    'amazon-braket-sdk',  # Amazon Braket SDK -- local simulator + AWS devices/QPUs
    'cirq',               # Google Cirq
    # -- nuclear gradients -------------------------------------------------- #
    # JAX differentiates the small algebraic layer (Loewdin / SCF / integral
    # transforms) that the Pulay force needs; see carcara.algorithms.forces.
    'jax',
    # -- test suite -------------------------------------------------------- #
    'pytest',             # `python -m pytest test/` ships with the package
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
# Alternative Parquet engine.  Not a default: on some platforms pyarrow's
# Parquet writer crashes in a process that has also run Qiskit's transpiler
# (see the warning in carcara.core.serialization).
pyarrow = ['pyarrow']
docs = ['sphinx', 'sphinx-rtd-theme', 'myst-parser', 'furo']
dev = ['pyarrow', 'sphinx', 'sphinx-rtd-theme', 'myst-parser', 'furo']

[project.urls]
"Homepage" = "https://github.com/seixas-research/carcara"
"Documentation" = "https://carcara.readthedocs.io/en/latest/"

[tool.hatch.version]
path = "src/carcara/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/carcara"]
