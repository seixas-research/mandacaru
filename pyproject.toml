[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "mandacaru"
dynamic = ["version", "readme"]
authors = [
  { name="Leandro Seixas Rocha", email="leandro.rocha@ilum.cnpem.br" },
]
description = "Everything you need for fermionic quantum simulation."
license = {file = "LICENSE"} 
requires-python = ">=3.14"
dependencies = [
    # -- numerical core -------------------------------------------------- #
    'numpy>=2.0.0',
    'scipy',
    'ase',
    'spglib',
    'matplotlib',
    # -- Hamiltonian cache (Apache Parquet) ------------------------------ #
    'fastparquet',
    'pandas',
    # -- quantum SDKs (backend_provider / device registry) ---------------- #
    'qiskit',             # IBM Qiskit -- default circuit provider + profiling
    'qiskit-ibm-runtime', # IBM Qiskit Runtime -- the reserved 'ibm-quantum' device
    'amazon-braket-sdk',  # Amazon Braket SDK -- local simulator + AWS devices/QPUs
    'cirq',               # Google Cirq
    # -- test suite -------------------------------------------------------- #
    'pytest',             # `python -m pytest test/` ships with the package
    # -- for PERFORMANCE block --------------------------------------------- #
    'psutil'
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
# The legacy differentiated-SCF force path, force_method="scf-response": JAX
# differentiates its Loewdin / SCF / integral-transform layer.  The default
# force_method="rdm" needs none of it (see mandacaru.algorithms.forces).
legacy-forces = ['jax']
# Training VALQA's learned proposal (mandacaru.algorithms.train_proposal_model):
# JAX differentiates the graph network and the Gaussian-process likelihood.
# Using a trained model (method="valqa", proposal_model=...) needs none of it.
learned-proposals = ['jax']
docs = ['sphinx>=8,<10', 'myst-parser>=4,<6', 'furo>=2024.8.6']
coverage = ['pytest-cov']
dev = ['pyarrow', 'psutil', 'jax', 'sphinx>=8,<10', 'myst-parser>=4,<6',
       'furo>=2024.8.6', 'pytest-cov']

[tool.pytest.ini_options]
# `python -m pytest` with no arguments runs the whole suite (there is no CI:
# it is run locally).
testpaths = ["test"]
# `-m "not slow"` is what keeps a bare run inside the session budget that
# `test/conftest.py` enforces.  The slow mark is for tests that *generate* a
# pseudopotential from scratch: a scalar-relativistic reference atom costs
# 20-40 s per element, and the suite has dozens of them.  Nothing is skipped
# silently -- `python -m pytest -m slow` runs exactly those, and
# `python -m pytest -m ""` runs everything.
addopts = "-q -m 'not slow'"
markers = [
    "slow: generates a pseudopotential or PAW-LCAO dataset from scratch",
]
filterwarnings = [
    # A fallback to the NumPy kernels is announced once; it is not a failure.
    "default::RuntimeWarning",
]

[tool.coverage.run]
source = ["src/mandacaru"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[project.scripts]
mandacaru = "mandacaru.cli:main"
mandacaru-build = "mandacaru.pseudopotentials.build_cli:main"

[project.urls]
"Homepage" = "https://github.com/seixas-research/mandacaru"
"Documentation" = "https://mandacaru.readthedocs.io/en/latest/"

[tool.hatch.version]
path = "src/mandacaru/version.py"

# The PyPI description is README.md with its GitHub-only markup rewritten.
# GitHub picks the logo for its light or dark theme from the
# #gh-light-mode-only / #gh-dark-mode-only fragments; PyPI ignores them and
# would show both logos, so it gets the light one alone.  Relative links are
# made absolute, since PyPI has no repository to resolve them against.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '<img src="[^"]*#gh-dark-mode-only"[^>]*>\n?'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '#gh-light-mode-only'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(LICENSE\)'
replacement = '](https://github.com/seixas-research/mandacaru/blob/main/LICENSE)'

[tool.hatch.build.targets.wheel]
packages = ["src/mandacaru"]
# No pseudopotential data ships in the wheel: the ONCVPSP and PAW-LCAO
# libraries live in the mandacaru-oncvpsp and mandacaru-paw
# repositories, found through MANDACARU_{ONCVPSP,PAW}_PATH.
