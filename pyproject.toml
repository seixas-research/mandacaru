[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mandacaru"
dynamic = ["version"]
authors = [
  { name="Leandro Seixas Rocha", email="leandro.rocha@ilum.cnpem.br" },
]
description = "A framework for fermionic quantum simulation based on variational quantum algorithms."
readme = "README.md"
license = {file = "LICENSE"} 
requires-python = ">=3.14"
dependencies = [
    # -- numerical core -------------------------------------------------- #
    'numpy>=2.0.0',
    'scipy',
    'ase',
    'spglib',
    'matplotlib',
    # -- Hamiltonian cache (Apache Parquet) ------------------------------ #
    'fastparquet',
    'pandas',
    # -- quantum SDKs (backend_provider / device registry) ---------------- #
    'qiskit',             # IBM Qiskit -- default circuit provider + profiling
    'qiskit-ibm-runtime', # IBM Qiskit Runtime -- the reserved 'ibm-quantum' device
    'amazon-braket-sdk',  # Amazon Braket SDK -- local simulator + AWS devices/QPUs
    'cirq',               # Google Cirq
    # -- test suite -------------------------------------------------------- #
    'pytest',             # `python -m pytest test/` ships with the package
    # -- for PERFORMANCE block --------------------------------------------- #
    'psutil'
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
# The legacy differentiated-SCF force path, force_method="scf-response": JAX
# differentiates its Loewdin / SCF / integral-transform layer.  The default
# force_method="rdm" needs none of it (see mandacaru.algorithms.forces).
legacy-forces = ['jax']
docs = ['sphinx>=8,<10', 'myst-parser>=4,<6', 'furo>=2024.8.6']
coverage = ['pytest-cov']
dev = ['pyarrow', 'psutil', 'jax', 'sphinx>=8,<10', 'myst-parser>=4,<6',
       'furo>=2024.8.6', 'pytest-cov']

[tool.pytest.ini_options]
# `python -m pytest` with no arguments runs the whole suite (there is no CI:
# it is run locally).
testpaths = ["test"]
addopts = "-q"
filterwarnings = [
    # A fallback to the NumPy kernels is announced once; it is not a failure.
    "default::RuntimeWarning",
]

[tool.coverage.run]
source = ["src/mandacaru"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[project.scripts]
mandacaru = "mandacaru.cli:main"

[project.urls]
"Homepage" = "https://github.com/seixas-research/mandacaru"
"Documentation" = "https://mandacaru.readthedocs.io/en/latest/"

[tool.hatch.version]
path = "src/mandacaru/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mandacaru"]
# The ONCVPSP and PAW libraries (~600 MB) live in the mandacaru-oncvpsp and
# mandacaru-paw repositories and are linked into library/ locally; PyPI caps a
# release at 100 MB, so only the 11 MB NCPP library ships in the wheel.
exclude = [
  "src/mandacaru/pseudopotentials/library/oncvpsp",
  "src/mandacaru/pseudopotentials/library/paw",
]
