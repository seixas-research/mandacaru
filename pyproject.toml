[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carcara"
dynamic = ["version"]
authors = [
  { name="Leandro Seixas Rocha", email="leandro.rocha@ilum.cnpem.br" },
]
description = "A framework for fermionic quantum simulation based on variational quantum algorithms."
readme = "README.md"
license = {file = "LICENSE"} 
requires-python = ">=3.14"
dependencies = [
    'numpy>=2.0.0',
    'pandas',
    'ase',
    'scipy',
    'matplotlib',
    'pytest',
    'pyyaml',
    'qiskit',
    'qiskit-nature',
    'qiskit-ibm-runtime'
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]

[project.urls]
"Homepage" = "https://github.com/seixas-research/carcara"
"Documentation" = "https://carcara.readthedocs.io/en/latest/"

[tool.hatch.version]
path = "src/carcara/version.py"
