[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "mandacaru"
dynamic = ["version", "readme"]
authors = [
  { name="Leandro Seixas Rocha", email="leandro.rocha@ilum.cnpem.br" },
]
description = "Everything you need for fermionic quantum simulation."
license = {file = "LICENSE"} 
requires-python = ">=3.14"
dependencies = [
    'numpy>=2.0.0',
    'scipy',
    'threadpoolctl',
    'ase',
    'spglib',
    'matplotlib',
    'fastparquet',
    'pandas',
    'qiskit',
    'qiskit-aer',
    'qiskit-ibm-runtime',
    'amazon-braket-sdk',
    'cirq',
    'pytest',
    'psutil',
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
docs = ['sphinx>=8,<10', 'myst-parser>=4,<6', 'furo>=2024.8.6']
coverage = ['pytest-cov']
dev = ['pytest-cov', 'pyarrow', 'sphinx>=8,<10', 'myst-parser>=4,<6', 'furo>=2024.8.6']

[tool.pytest.ini_options]
# The full scientific suite and the independent architecture checks live in test/.
testpaths = ["test"]
# `-m "not slow"` is what keeps a bare run inside the session budget that
# `test/conftest.py` enforces.  The slow mark is for tests that *generate* a
# pseudopotential from scratch: a scalar-relativistic reference atom costs
# 20-40 s per element, and the suite has dozens of them -- and for the crystal
# force and stress checks, a minute or more each.  Nothing is skipped
# silently -- `python -m pytest -m slow` runs exactly those, and
# `python -m pytest -m ""` runs everything.
addopts = "-q -m 'not slow'"
markers = [
    "slow: generates a pseudopotential or PAW-LCAO dataset from scratch, or computes crystal forces or stress",
]
filterwarnings = [
    "default::RuntimeWarning",
]

[tool.coverage.run]
source = ["src/mandacaru"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[project.scripts]
mandacaru = "mandacaru.cli:main"
mandacaru-paw = "mandacaru.pseudopotentials.library_cli:main"

[project.urls]
"Homepage" = "https://github.com/seixas-research/mandacaru"
"Documentation" = "https://mandacaru.readthedocs.io/en/latest/"

[tool.hatch.version]
path = "src/mandacaru/version.py"

# The PyPI description is README.md with its GitHub-only markup rewritten.
# GitHub picks the logo for its light or dark theme from the
# #gh-light-mode-only / #gh-dark-mode-only fragments; PyPI ignores them and
# would show both logos, so it gets the light one alone.  Relative links are
# made absolute, since PyPI has no repository to resolve them against.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '<img src="[^"]*#gh-dark-mode-only"[^>]*>\n?'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '#gh-light-mode-only'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(LICENSE\)'
replacement = '](https://github.com/seixas-research/mandacaru/blob/main/LICENSE)'

[tool.hatch.build.targets.wheel]
packages = ["src/mandacaru"]
exclude = ["**/target/**", "**/build/**", "**/__pycache__/**",
           "**/*.dylib", "**/*.dll", "**/*.so", "**/csrc/**"]
# No pseudopotential data ships in the wheel: the PAW-LCAO library lives in
# the mandacaru-paw repository, found through MANDACARU_PAW_PATH.

[tool.hatch.build.targets.wheel.hooks.custom]
path = "build_hooks/native.py"

[tool.hatch.build.targets.sdist]
# Traverse only source inputs; local Cargo caches and scratch trees can be large.
only-include = ["src/mandacaru", "crates", "build_hooks", "Cargo.toml", "Cargo.lock",
                "pyproject.toml", "README.md", "LICENSE",
                "test/migration/reference/h2_hamiltonian.json", "test/migration/phase5/si_crystal.json"]
exclude = ["**/target/**", "**/build/**", "**/__pycache__/**",
           "**/*.dylib", "**/*.dll", "**/*.so", "**/csrc/**"]
