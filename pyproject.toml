[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carcara"
dynamic = ["version"]
authors = [
  { name="Leandro Seixas Rocha", email="leandro.rocha@ilum.cnpem.br" },
]
description = "A framework for fermionic quantum simulation based on variational quantum algorithms."
readme = "README.md"
license = {file = "LICENSE"} 
requires-python = ">=3.14"
dependencies = [
    'numpy>=2.0.0',
    'pandas',
    'ase',
    'scipy',
    'matplotlib',
    'pytest',
    'pyyaml',
    'qiskit',             # IBM Qiskit
    'qiskit-nature',      # IBM Qiskit Nature
    'qiskit-ibm-runtime'  # IBM Qiskit Runtime
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
accel = [
    'numba>=0.60',
    'numpy<2.5',
]
#   conda install -c conda-forge libxc pylibxc

[project.urls]
"Homepage" = "https://github.com/seixas-research/carcara"
"Documentation" = "https://carcara.readthedocs.io/en/latest/"

[tool.hatch.version]
path = "src/carcara/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/carcara"]

# Ship the Gaussian basis-set data files (NWChem format) inside the package.
[tool.hatch.build.targets.wheel.force-include]
"src/carcara/basis/gto_sets" = "carcara/basis/gto_sets"
