version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.14"
    # `pip install .` builds the Rust extension (build_hooks/native.py runs cargo).
    rust: "latest"

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true
